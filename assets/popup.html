<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GTA6 Filter</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon32.png" width="32" height="32" alt="">
        <h1>GTA6 Filter</h1>
      </header>

      <label class="toggle master">
        <span data-i18n="protection"></span>
        <input type="checkbox" id="enabled" role="switch" disabled>
      </label>

      <fieldset>
        <legend data-i18n="platforms"></legend>
        <label class="toggle">YouTube <input type="checkbox" id="youtube" role="switch" disabled></label>
        <label class="toggle">Reddit <input type="checkbox" id="reddit" role="switch" disabled></label>
        <label class="toggle">X <input type="checkbox" id="x" role="switch" disabled></label>
      </fieldset>

      <form>
        <label for="terms" data-i18n="terms"></label>
        <p id="terms-hint" data-i18n="termsHint"></p>
        <textarea id="terms" rows="4" dir="auto" aria-describedby="terms-hint" spellcheck="false" disabled></textarea>
        <footer>
          <button type="submit" data-i18n="save" disabled></button>
          <span id="status" role="status"></span>
        </footer>
      </form>
    </main>
  </body>
</html>
